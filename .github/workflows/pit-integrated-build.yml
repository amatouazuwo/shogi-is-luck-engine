name: Pit engine integrated NNUE build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pit-integrated-build.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          git clone --depth 1 --branch v1.7.2 https://github.com/nyoki-mtl/rsshogi.git rules
          rustup toolchain install 1.95.0 --profile minimal
      - name: Implement isolated fixed-mask prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board')
          p=root/'position/attacks.rs'
          s=p.read_text()
          # Prototype only: fixed obstacle at center, not a production position field.
          s=s.replace('impl Position {','''impl Position {
              pub(crate) fn prototype_holes() -> Bitboard {
                  Bitboard::from_square(Square::from_index(40))
              }
          ''',1)
          for marker in ['let sq_idx = sq.to_index();']:
              s=s.replace(marker,'let occupied = occupied | Self::prototype_holes();\n        '+marker)
          s=s.replace('let occupied = bb.occupied();','let occupied = bb.occupied() | Self::prototype_holes();')
          p.write_text(s)
          p=root/'movegen/pieces.rs'
          s=p.read_text().replace('let occupied = pos.bitboards().occupied();','let occupied = pos.bitboards().occupied() | Position::prototype_holes();').replace('let enemy = occupied.and_not(ours);','let enemy = pos.bitboards().occupied().and_not(ours);').replace('.and_not(ours);\n\n    macro_rules!', '.and_not(ours | Position::prototype_holes());\n\n    macro_rules!')
          s=s.replace('let occupied = pos.bitboards().occupied().and_not(Bitboard::from_square(from));','let occupied = (pos.bitboards().occupied() | Position::prototype_holes()).and_not(Bitboard::from_square(from));')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board')
          p=root/'position/attacks.rs'
          s=p.read_text().replace('pub(crate) fn prototype_holes() -> Bitboard {\n        Bitboard::from_square(Square::from_index(40))\n    }','pub(crate) fn prototype_holes(&self) -> Bitboard { self.holes }')
          s=s.replace('Self::prototype_holes()', 'self.prototype_holes()')
          p.write_text(s)
          p=root/'position/mod.rs'
          s=p.read_text().replace('pub struct Position {','pub struct Position {\n    pub(super) holes: crate::types::Bitboard,').replace('board: Clone::clone(&self.board),','holes: self.holes,\n            board: Clone::clone(&self.board),').replace('board: self.board,','holes: self.holes,\n            board: self.board,').replace('self.board = source.board;','self.holes = source.holes;\n        self.board = source.board;')
          p.write_text(s)
          p=root/'position/constructors.rs'
          s=p.read_text().replace('king_square: [Square::NONE; Color::COUNT],','holes: crate::types::Bitboard::EMPTY,\n            king_square: [Square::NONE; Color::COUNT],')
          p.write_text(s)
          p=root/'movegen/pieces.rs'
          p.write_text(p.read_text().replace('Position::prototype_holes()', 'pos.prototype_holes()'))
          p=root/'movegen/drops.rs'
          p.write_text(p.read_text().replace('let empties = pos.empties();','let empties = pos.empties().and_not(pos.prototype_holes());'))
          p=root/'position/legality.rs'
          p.write_text(p.read_text().replace('let to = m.to_sq();','let to = m.to_sq();\n        if self.prototype_holes().test(to) { return false; }').replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.prototype_holes();'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board/position')
          p=root/'rules.rs'
          s=p.read_text()
          marker='Self {\n            board: self.board,'
          assert marker in s
          p.write_text(s.replace(marker,'Self {\n            holes: self.holes,\n            board: self.board,'))
          p=root/'attacks.rs'
          s=p.read_text()
          marker='let between = Bitboard::between(sniper_sq, king_sq) & occupancy;'
          assert marker in s
          s=s.replace(marker,'if Bitboard::between(sniper_sq, king_sq).intersects(self.holes) { continue; }\n            '+marker)
          s=s.replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.holes;')
          p.write_text(s)
          p=root/'cache.rs'
          s=p.read_text().replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.holes;').replace('let occupancy = self.bitboards().occupied() & avoid_bb;','let occupancy = (self.bitboards().occupied() & avoid_bb) | self.holes;')
          p.write_text(s)
          p=root/'constructors.rs'
          s=p.read_text().replace('impl Position {','''impl Position {
              /// Experimental root-only obstacle setter; resets history.
              pub fn obstacle_mask(&self) -> crate::types::Bitboard { self.holes }
              pub fn set_prototype_holes(&mut self, holes: crate::types::Bitboard) -> bool {
                  if holes.intersects(self.bitboards().occupied()) { return false; }
                  self.holes = holes;
                  self.init_stack();
                  true
              }
          ''',1)
          p.write_text(s)
          PY
          mkdir -p rules/crates/rsshogi/tests
          cat > rules/crates/rsshogi/tests/shogiluck_holes.rs <<'RS'
          use rsshogi::board::{self, Position, MoveList, Bitboard, movegen::generate_legal_all};
          use rsshogi::types::{Move, Square};
          fn sq(s: &str) -> Square { Move::from_usi(&format!("7g{s}")).unwrap().to_sq() }
          fn setup(sfen: &str, holes: &[&str]) -> Position {
              board::init();
              let mut p = board::position_from_sfen(sfen).unwrap();
              let mut mask = Bitboard::EMPTY;
              for s in holes { mask.set(sq(s)); }
              assert!(p.set_prototype_holes(mask));
              p
          }
          fn has(p: &Position, s: &str) -> bool {
              let mut list = MoveList::new();
              generate_legal_all(p, &mut list);
              list.as_slice().contains(&Move::from_usi(s).unwrap())
          }
          #[test]
          fn rook_block_and_drop() {
              let p = setup("k8/9/9/9/9/9/4R4/9/8K b G 1", &["5e"]);
              assert!(has(&p,"5g5f"));
              assert!(!has(&p,"5g5e"));
              assert!(!has(&p,"5g5d"));
              assert!(!has(&p,"G*5e"));
              assert!(has(&p,"G*4e"));
              assert!(!has(&p.clone_for_search(),"5g5d"));
          }
          #[test]
          fn knight_and_multiple_holes() {
              let p = setup("k8/9/9/9/9/9/4N4/9/8K b G 1", &["5f","4f","6f","4e"]);
              assert!(has(&p,"5g6e"));
              assert!(!has(&p,"5g4e"));
              assert!(!has(&p,"G*6f"));
          }
          #[test]
          fn rook_check_and_pin() {
              let p = setup("k3r4/9/9/9/9/9/9/9/4K4 b - 1", &["5e"]);
              assert!(!p.is_in_check());
              let p = setup("k3r4/9/9/9/9/9/4G4/9/4K4 b - 1", &["5e"]);
              assert!(has(&p,"5g4g"));
              let p = setup("k3r4/9/9/9/9/9/4G4/9/4K4 b - 1", &[]);
              assert!(!has(&p,"5g4g"));
          }
          #[test]
          fn blackhole_nine_squares_and_undo() {
              let mut p = setup("k8/9/9/9/9/9/4R4/9/8K b G 1",
                  &["4d","5d","6d","4e","5e","6e","4f","5f","6f"]);
              let before = p.to_sfen(None);
              let mut list = MoveList::new();
              generate_legal_all(&p, &mut list);
              for m in list.as_slice() {
                  assert!(!["4d","5d","6d","4e","5e","6e","4f","5f","6f"].iter().any(|s| sq(s)==m.to_sq()));
              }
              assert!(!has(&p,"5g5c"));
              assert!(has(&p,"5g3g"));
              let m = p.move32_from_move(Move::from_usi("5g3g").unwrap());
              p.apply_move32(m);
              p.undo_move32(m).unwrap();
              assert_eq!(before,p.to_sfen(None));
              assert!(!has(&p,"5g5f"));
          }
          #[test]
          fn mate_and_escape() {
              let p = setup("4k4/4R4/4G4/9/9/9/9/9/8K w - 1",
                  &["4a","6a","4b","6b"]);
              assert!(p.is_in_check());
              let mut list = MoveList::new();
              generate_legal_all(&p,&mut list);
              assert!(list.as_slice().is_empty());
              let p = setup("4k4/4R4/4G4/9/9/9/9/9/8K w - 1",
                  &["6a","4b","6b"]);
              assert!(has(&p,"5a4a"));
          }
          #[test]
          fn bishop_and_lance_block() {
              let p = setup("k8/9/9/9/9/9/4B3L/9/8K b - 1",&["4f","1e"]);
              assert!(!has(&p,"5g3e"));
              assert!(has(&p,"5g6f"));
              assert!(has(&p,"1g1f"));
              assert!(!has(&p,"1g1d"));
          }
          RS
          git -C rules diff --check
          git -C rules diff
      - name: Compile prototype
        run: |
          cd rules
          cargo +1.95.0 check -p rsshogi --lib
          cargo +1.95.0 test -p rsshogi --lib
          cargo +1.95.0 test -p rsshogi --test shogiluck_holes
      - name: Build actual engine with modified rules and exact model
        run: |
          git clone --depth 1 --branch v0.4.0 https://github.com/nyoki-mtl/rsshogi-nnue-mini.git engine
          curl -fsSL --retry 3 https://github.com/nyoki-mtl/rsshogi-nnue-mini/releases/download/v0.4.0/rsshogi-nnue-mini-v0.4.0-wasm-sdk.zip -o sdk.zip
          echo '3d05b85949f5ae3bce3cef1f0678a3aeb31d9e8f935565bcc09da63bb19dd1d1  sdk.zip' | sha256sum -c -
          unzip -q sdk.zip -d sdk
          python3 - <<'PY'
          import pathlib,struct,hashlib
          b=next(pathlib.Path('sdk').rglob('*.wasm')).read_bytes()
          assert hashlib.sha256(b).hexdigest()=='feb190263b48caed5a81e0009cda35f6d2a23548ccf61d785f019420b857222d'
          magic=b'RSNNPKG'+bytes([0])
          matches=[]
          i=b.find(magic)
          while i>=0:
              if i+28<=len(b):
                  ver,flags,m,p=struct.unpack_from('<HHQQ',b,i+8)
                  if ver==1 and flags==0 and i+28+m+p<=len(b):
                      candidate=b[i:i+28+m+p]
                      if hashlib.sha256(candidate).hexdigest()=='787739972eabb5a1c42c471d178ac0c97b688dce35c72b4291e7e1eeefa9786f':
                          matches.append(candidate)
              i=b.find(magic,i+1)
          assert len(matches)==1, 'Exact model not found; do not substitute weights'
          pathlib.Path('model.rsnn').write_bytes(matches[0])
          print('EXACT MODEL PASS',len(matches[0]))
          PY
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cat >> engine/src/search/see.rs <<'RS'
          #[cfg(test)]
          mod obstacle_see_tests {
              use super::*;
              #[test]
              fn hole_blocks_recapture() {
                  rsshogi::board::init();
                  let mut p = rsshogi::board::position_from_sfen("k3r4/9/9/9/9/4p4/4G4/9/8K b - 1").unwrap();
                  let m = p.move32_from_usi("5g5f").unwrap();
                  let params = EvalParams::default();
                  let exposed = static_exchange_eval(&p,m,params).unwrap();
                  let hole = rsshogi::types::Move::from_usi("7g5d").unwrap().to_sq();
                  assert!(p.set_prototype_holes(Bitboard::from_square(hole)));
                  let shielded = static_exchange_eval(&p,m,params).unwrap();
                  assert!(shielded > exposed, "hole must prevent rook recapture");
                  assert_eq!(shielded,capture_gain(PieceType::PAWN,params));
                  assert!(static_exchange_ge(&p,m,shielded,params));
                  assert!(!static_exchange_ge(&p,m,shielded+1,params));
              }
          }
          RS
          cat >> engine/src/search.rs <<'RS'
          #[cfg(test)]
          mod obstacle_search_tests {
              use super::*;
              use super::test_support::{depth_limits, run_result};
              use rsshogi::types::{Bitboard, Move};
              #[test]
              fn forced_hole_terminal_win_search() {
                  rsshogi::board::init();
                  let mut p = rsshogi::board::position_from_sfen("4k4/9/9/3G1R3/9/9/9/9/8K b - 1").unwrap();
                  let mut holes=Bitboard::EMPTY;
                  for s in ["4a","6a","4b","6b"] {
                      holes.set(Move::from_usi(&format!("7g{s}")).unwrap().to_sq());
                  }
                  assert!(p.set_prototype_holes(holes));
                  assert!(!p.is_in_check());
                  assert!(!legal_moves(&p).is_empty(), "fixture has legal moves");
                  let result=run_result(p.clone_for_search(),depth_limits(4),1);
                  let mv=result.best_move.expect("must find a move");
                  eprintln!("OBSTACLE_SEARCH best={} score={} depth={} nodes={}",mv.to_usi(),result.score,result.depth,result.nodes);
                  assert!(p.is_legal_move32(mv));
                  p.apply_move32(mv);
                  assert!(result.score >= MATE-4, "must recognize terminal win");
                  assert!(legal_moves(&p).is_empty(), "must find terminal win in one");
                  eprintln!("OBSTACLE_TERMINAL check={} best={} depth={} nodes={}",p.is_in_check(),mv.to_usi(),result.depth,result.nodes);
              }
              #[test]
              fn genuine_mate_with_remaining_escape_square() {
                  rsshogi::board::init();
                  let mut p = rsshogi::board::position_from_sfen("4k4/9/4G4/4R4/9/9/9/9/8K b - 1").unwrap();
                  let mut holes=Bitboard::EMPTY;
                  for s in ["6a","4b","6b"] {
                      holes.set(Move::from_usi(&format!("7g{s}")).unwrap().to_sq());
                  }
                  assert!(p.set_prototype_holes(holes));
                  let checking_mates: Vec<_> = legal_moves(&p).into_iter().filter(|&m| {
                      let mut child=p.clone_for_search();
                      child.apply_move32(m);
                      child.is_in_check() && legal_moves(&child).is_empty()
                  }).collect();
                  assert!(!checking_mates.is_empty(),"fixture must contain a genuine mate");
                  let mut limits=depth_limits(4);
                  limits.searchmoves=checking_mates.iter().map(|m|m.to_usi()).collect();
                  let result=run_result(p.clone_for_search(),limits,1);
                  assert!(result.score>=MATE-4);
                  let mv=result.best_move.unwrap();
                  p.apply_move32(mv);
                  assert!(p.is_in_check() && legal_moves(&p).is_empty());
              }
          }
          RS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/src/search/context.rs')
          s=p.read_text()
          marker='    position.key().low_u64() ^ fingerprint.rotate_left(1)'
          assert s.count(marker)==1
          s=s.replace(marker,'''    let mut holes = position.obstacle_mask();
              while let Some(sq) = holes.pop_lsb() {
                  mix_tt_component(&mut fingerprint, 0x484f4c4500000000u64 | sq.to_index() as u64);
              }
          '''+marker)
          p.write_text(s)
          PY
          cat >> engine/src/search/context.rs <<'RS'
          #[cfg(test)]
          mod obstacle_cache_tests {
              use super::*;
              use rsshogi::types::{Bitboard, Move};
              #[test]
              fn distinct_masks_have_distinct_tt_keys() {
                  rsshogi::board::init();
                  let mut p=rsshogi::board::hirate_position();
                  let base=tt_key(&p,0);
                  let mut keys=std::collections::HashSet::from([base]);
                  for square in ["4e","5e","6e","4d","5d","6d","4f","5f","6f"] {
                      let sq=Move::from_usi(&format!("7g{square}")).unwrap().to_sq();
                      assert!(p.set_prototype_holes(Bitboard::from_square(sq)));
                      let key=tt_key(&p,0);
                      assert!(keys.insert(key));
                      assert_eq!(key,tt_key(&p.clone_for_search(),0));
                  }
                  assert!(p.set_prototype_holes(Bitboard::EMPTY));
                  assert_eq!(base,tt_key(&p,0));
              }
          }
          RS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/src/api.rs')
          s=p.read_text()
          marker='    pub fn new_game(&mut self) {'
          assert marker in s
          s=s.replace(marker,'''    pub fn set_obstacle_position(&mut self, sfen: &str, holes: &[String]) -> Result<(), String> {
                  use rsshogi::types::{Bitboard, Move};
                  let fields: Vec<_> = sfen.split_whitespace().collect();
                  if fields.len()!=4 { return Err("expected four SFEN fields".into()); }
                  crate::position::validate_sfen_hands(fields[2])?;
                  let mut position=board::position_from_sfen(sfen).map_err(|e|e.to_string())?;
                  let mut mask=Bitboard::EMPTY;
                  for square in holes {
                      let b=square.as_bytes();
                      if b.len()!=2 || !(b'1'..=b'9').contains(&b[0]) || !(b'a'..=b'i').contains(&b[1]) {
                          return Err("invalid obstacle square".into());
                      }
                      let sq=Move::from_usi(&format!("{}{}",if square=="7g" {"8g"} else {"7g"},square)).ok_or("invalid square")?.to_sq();
                      if mask.test(sq) { return Err("duplicate obstacle".into()); }
                      mask.set(sq);
                  }
                  if !position.set_prototype_holes(mask) { return Err("obstacle overlaps piece".into()); }
                  crate::position::validate_evaluable_position(&position)?;
                  position.set_entering_king_rule(EnteringKingRule::None);
                  if self.position.obstacle_mask()!=mask {
                      self.table.clear();
                      if let Some(c)=&mut self.coordinator { c.clear(); }
                  }
                  self.position=position;
                  Ok(())
              }
          '''+marker)
          p.write_text(s)
          p=Path('engine/src/position.rs')
          s=p.read_text().replace('fn validate_sfen_hands(', 'pub(crate) fn validate_sfen_hands(')
          p.write_text(s)
          p=Path('engine/src/ffi.rs')
          s=p.read_text().replace('    Configure {','    SetObstaclePosition { sfen: String, holes: Vec<String> },\n    Configure {',1)
          s=s.replace('        Request::Configure { hash_mb, threads } => {','''        Request::SetObstaclePosition { sfen, holes } => {
                      engine.set_obstacle_position(&sfen,&holes)?;
                      Ok(json!({"ok":true}))
                  }
                  Request::Configure { hash_mb, threads } => {''',1)
          p.write_text(s)
          PY
          cat >> engine/src/api.rs <<'RS'
          #[cfg(all(test, feature="embedded-rsnn"))]
          mod obstacle_api_tests {
              use super::*;
              #[test]
              fn exact_model_obstacle_search_and_invalid_input() {
                  let mut e=Engine::new();
                  e.load_embedded().unwrap();
                  e.configure(Some(1),Some(1)).unwrap();
                  let sfen="4k4/9/9/3G1R3/9/9/9/9/8K b - 1";
                  let holes=["4a","6a","4b","6b"].map(str::to_owned);
                  e.set_obstacle_position(sfen,&holes).unwrap();
                  assert!(e.set_obstacle_position(sfen,&["5a".into()]).is_err());
                  assert!(e.set_obstacle_position(sfen,&["0a".into()]).is_err());
                  let out=e.search(SearchOptions{depth:4,..Default::default()}).unwrap();
                  assert!(out.score>=31996, "{out:?}");
                  let mv=board::move_from_usi(&e.position,&out.bestmove).unwrap();
                  assert!(e.position.is_legal_move32(mv));
                  e.position.apply_move32(mv);
                  let mut list=rsshogi::board::Move32List::new();
                  rsshogi::board::generate_legal_all_move32(&e.position,&mut list);
                  assert!(list.as_slice().is_empty());
                  eprintln!("EXACT_NNUE_OBSTACLE_SEARCH {out:?}");
              }
          }
          RS
          cd engine
          printf '\n[patch.crates-io]\nrsshogi = { path = "../rules/crates/rsshogi" }\n' >> Cargo.toml
          cargo +1.95.0 update -p rsshogi --precise 1.7.2
          export RSSHOGI_EMBEDDED_RSNN_PATH="$PWD/../model.rsnn"
          export RSSHOGI_EMBEDDED_RSNN_SHA256=787739972eabb5a1c42c471d178ac0c97b688dce35c72b4291e7e1eeefa9786f
          cargo +1.95.0 test --lib --locked --features c-api,embedded-rsnn
          cargo +1.95.0 rustc --lib --release --locked --crate-type cdylib --target wasm32-unknown-unknown --features c-api,embedded-rsnn
          test -s target/wasm32-unknown-unknown/release/rsshogi_nnue_mini.wasm
          echo EMBEDDED_REBUILD_PASS
          cat > bindings/wasm/obstacle-smoke.mjs <<'JS'
          import {readFile} from 'node:fs/promises';
          import {MiniEngine} from './mini.js';
          import assert from 'node:assert/strict';
          const e=await MiniEngine.create(await readFile('target/wasm32-unknown-unknown/release/rsshogi_nnue_mini.wasm'));
          const req=x=>{const r=e.request(x);assert.equal(r.ok,true,JSON.stringify(r));return r;};
          req({command:'load_embedded'});
          req({command:'configure',hash_mb:4,threads:1});
          const sfen='4k4/9/9/9/9/9/4R4/9/8K b - 1';
          assert.equal(e.request({command:'set_position',sfen}).ok,false);
          for(const holes of [['5e'],['4d','5d','6d','4e','5e','6e','4f','5f','6f']]){
            req({command:'set_obstacle_position',sfen,holes});
            const r=req({command:'search',depth:64,movetime_ms:100}).result;
            assert.ok(r.nodes>0);
            assert.notEqual(r.bestmove,'resign');
            assert.ok(!holes.includes(r.bestmove.slice(2,4)));
            console.log('OBSTACLE_WASM_SEARCH',JSON.stringify({holes,...r}));
          }
          assert.equal(e.request({command:'set_obstacle_position',sfen,holes:['5g']}).ok,false);
          assert.equal(e.request({command:'set_obstacle_position',sfen,holes:['0z']}).ok,false);
          e.dispose();
          JS
          node bindings/wasm/obstacle-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: obstacle-wasm-experimental
          path: |
            engine/target/wasm32-unknown-unknown/release/rsshogi_nnue_mini.wasm
            engine/LICENSE
            engine/bindings/wasm/mini.js
            engine/bindings/wasm/worker.js
