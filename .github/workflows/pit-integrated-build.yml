name: Pit engine integrated NNUE build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pit-integrated-build.yml'
      - 'patches/obstacle-*.patch'
      - 'scripts/build-obstacle-sdk.sh'
      - 'scripts/package-obstacle-sdk.py'
permissions:
  contents: read
jobs:
  obstacle-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: scripts/build-obstacle-sdk.sh "$RUNNER_TEMP/obstacle-sdk"
        env:
          RUN_ENGINE_TESTS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: obstacle-wasm-sdk
          path: ${{ runner.temp }}/obstacle-sdk/
          if-no-files-found: error
