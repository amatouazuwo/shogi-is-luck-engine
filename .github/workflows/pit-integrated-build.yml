name: Pit engine integrated NNUE build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pit-integrated-build.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          git clone --depth 1 --branch v1.7.2 https://github.com/nyoki-mtl/rsshogi.git rules
          rustup toolchain install 1.95.0 --profile minimal
      - name: Implement isolated fixed-mask prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board')
          p=root/'position/attacks.rs'
          s=p.read_text()
          # Prototype only: fixed obstacle at center, not a production position field.
          s=s.replace('impl Position {','''impl Position {
              pub(crate) fn prototype_holes() -> Bitboard {
                  Bitboard::from_square(Square::from_index(40))
              }
          ''',1)
          for marker in ['let sq_idx = sq.to_index();']:
              s=s.replace(marker,'let occupied = occupied | Self::prototype_holes();\n        '+marker)
          s=s.replace('let occupied = bb.occupied();','let occupied = bb.occupied() | Self::prototype_holes();')
          p.write_text(s)
          p=root/'movegen/pieces.rs'
          s=p.read_text().replace('let occupied = pos.bitboards().occupied();','let occupied = pos.bitboards().occupied() | Position::prototype_holes();').replace('let enemy = occupied.and_not(ours);','let enemy = pos.bitboards().occupied().and_not(ours);').replace('.and_not(ours);\n\n    macro_rules!', '.and_not(ours | Position::prototype_holes());\n\n    macro_rules!')
          s=s.replace('let occupied = pos.bitboards().occupied().and_not(Bitboard::from_square(from));','let occupied = (pos.bitboards().occupied() | Position::prototype_holes()).and_not(Bitboard::from_square(from));')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board')
          p=root/'position/attacks.rs'
          s=p.read_text().replace('pub(crate) fn prototype_holes() -> Bitboard {\n        Bitboard::from_square(Square::from_index(40))\n    }','pub(crate) fn prototype_holes(&self) -> Bitboard { self.holes }')
          s=s.replace('Self::prototype_holes()', 'self.prototype_holes()')
          p.write_text(s)
          p=root/'position/mod.rs'
          s=p.read_text().replace('pub struct Position {','pub struct Position {\n    pub(super) holes: crate::types::Bitboard,').replace('board: Clone::clone(&self.board),','holes: self.holes,\n            board: Clone::clone(&self.board),').replace('board: self.board,','holes: self.holes,\n            board: self.board,').replace('self.board = source.board;','self.holes = source.holes;\n        self.board = source.board;')
          p.write_text(s)
          p=root/'position/constructors.rs'
          s=p.read_text().replace('king_square: [Square::NONE; Color::COUNT],','holes: crate::types::Bitboard::EMPTY,\n            king_square: [Square::NONE; Color::COUNT],')
          p.write_text(s)
          p=root/'movegen/pieces.rs'
          p.write_text(p.read_text().replace('Position::prototype_holes()', 'pos.prototype_holes()'))
          p=root/'movegen/drops.rs'
          p.write_text(p.read_text().replace('let empties = pos.empties();','let empties = pos.empties().and_not(pos.prototype_holes());'))
          p=root/'position/legality.rs'
          p.write_text(p.read_text().replace('let to = m.to_sq();','let to = m.to_sq();\n        if self.prototype_holes().test(to) { return false; }').replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.prototype_holes();'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rules/crates/rsshogi/src/board/position')
          p=root/'rules.rs'
          s=p.read_text()
          marker='Self {\n            board: self.board,'
          assert marker in s
          p.write_text(s.replace(marker,'Self {\n            holes: self.holes,\n            board: self.board,'))
          p=root/'attacks.rs'
          s=p.read_text()
          marker='let between = Bitboard::between(sniper_sq, king_sq) & occupancy;'
          assert marker in s
          s=s.replace(marker,'if Bitboard::between(sniper_sq, king_sq).intersects(self.holes) { continue; }\n            '+marker)
          s=s.replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.holes;')
          p.write_text(s)
          p=root/'cache.rs'
          s=p.read_text().replace('let occupied = self.bitboards().occupied();','let occupied = self.bitboards().occupied() | self.holes;').replace('let occupancy = self.bitboards().occupied() & avoid_bb;','let occupancy = (self.bitboards().occupied() & avoid_bb) | self.holes;')
          p.write_text(s)
          p=root/'constructors.rs'
          s=p.read_text().replace('impl Position {','''impl Position {
              /// Experimental root-only obstacle setter; resets history.
              pub fn set_prototype_holes(&mut self, holes: crate::types::Bitboard) -> bool {
                  if holes.intersects(self.bitboards().occupied()) { return false; }
                  self.holes = holes;
                  self.init_stack();
                  true
              }
          ''',1)
          p.write_text(s)
          PY
          mkdir -p rules/crates/rsshogi/tests
          cat > rules/crates/rsshogi/tests/shogiluck_holes.rs <<'RS'
          use rsshogi::board::{self, Position, MoveList, Bitboard, movegen::generate_legal_all};
          use rsshogi::types::{Move, Square};
          fn sq(s: &str) -> Square { Move::from_usi(&format!("7g{s}")).unwrap().to_sq() }
          fn setup(sfen: &str, holes: &[&str]) -> Position {
              board::init();
              let mut p = board::position_from_sfen(sfen).unwrap();
              let mut mask = Bitboard::EMPTY;
              for s in holes { mask.set(sq(s)); }
              assert!(p.set_prototype_holes(mask));
              p
          }
          fn has(p: &Position, s: &str) -> bool {
              let mut list = MoveList::new();
              generate_legal_all(p, &mut list);
              list.as_slice().contains(&Move::from_usi(s).unwrap())
          }
          #[test]
          fn rook_block_and_drop() {
              let p = setup("k8/9/9/9/9/9/4R4/9/8K b G 1", &["5e"]);
              assert!(has(&p,"5g5f"));
              assert!(!has(&p,"5g5e"));
              assert!(!has(&p,"5g5d"));
              assert!(!has(&p,"G*5e"));
              assert!(has(&p,"G*4e"));
              assert!(!has(&p.clone_for_search(),"5g5d"));
          }
          #[test]
          fn knight_and_multiple_holes() {
              let p = setup("k8/9/9/9/9/9/4N4/9/8K b G 1", &["5f","4f","6f","4e"]);
              assert!(has(&p,"5g6e"));
              assert!(!has(&p,"5g4e"));
              assert!(!has(&p,"G*6f"));
          }
          #[test]
          fn rook_check_and_pin() {
              let p = setup("k3r4/9/9/9/9/9/9/9/4K4 b - 1", &["5e"]);
              assert!(!p.is_in_check());
              let p = setup("k3r4/9/9/9/9/9/4G4/9/4K4 b - 1", &["5e"]);
              assert!(has(&p,"5g4g"));
              let p = setup("k3r4/9/9/9/9/9/4G4/9/4K4 b - 1", &[]);
              assert!(!has(&p,"5g4g"));
          }
          #[test]
          fn blackhole_nine_squares_and_undo() {
              let mut p = setup("k8/9/9/9/9/9/4R4/9/8K b G 1",
                  &["4d","5d","6d","4e","5e","6e","4f","5f","6f"]);
              let before = p.to_sfen(None);
              let mut list = MoveList::new();
              generate_legal_all(&p, &mut list);
              for m in list.as_slice() {
                  assert!(!["4d","5d","6d","4e","5e","6e","4f","5f","6f"].iter().any(|s| sq(s)==m.to_sq()));
              }
              assert!(!has(&p,"5g5c"));
              assert!(has(&p,"5g3g"));
              let m = p.move32_from_move(Move::from_usi("5g3g").unwrap());
              p.apply_move32(m);
              p.undo_move32(m).unwrap();
              assert_eq!(before,p.to_sfen(None));
              assert!(!has(&p,"5g5f"));
          }
          #[test]
          fn mate_and_escape() {
              let p = setup("4k4/4R4/4G4/9/9/9/9/9/8K w - 1",
                  &["4a","6a","4b","6b"]);
              assert!(p.is_in_check());
              let mut list = MoveList::new();
              generate_legal_all(&p,&mut list);
              assert!(list.as_slice().is_empty());
              let p = setup("4k4/4R4/4G4/9/9/9/9/9/8K w - 1",
                  &["6a","4b","6b"]);
              assert!(has(&p,"5a4a"));
          }
          #[test]
          fn bishop_and_lance_block() {
              let p = setup("k8/9/9/9/9/9/4B3L/9/8K b - 1",&["4f","1e"]);
              assert!(!has(&p,"5g3e"));
              assert!(has(&p,"5g6f"));
              assert!(has(&p,"1g1f"));
              assert!(!has(&p,"1g1d"));
          }
          RS
          git -C rules diff --check
          git -C rules diff
      - name: Compile prototype
        run: |
          cd rules
          cargo +1.95.0 check -p rsshogi --lib
          cargo +1.95.0 test -p rsshogi --lib
          cargo +1.95.0 test -p rsshogi --test shogiluck_holes
      - name: Build actual engine with modified rules and exact model
        run: |
          git clone --depth 1 --branch v0.4.0 https://github.com/nyoki-mtl/rsshogi-nnue-mini.git engine
          curl -fsSL --retry 3 https://github.com/nyoki-mtl/rsshogi-nnue-mini/releases/download/v0.4.0/rsshogi-nnue-mini-v0.4.0-wasm-sdk.zip -o sdk.zip
          echo '3d05b85949f5ae3bce3cef1f0678a3aeb31d9e8f935565bcc09da63bb19dd1d1  sdk.zip' | sha256sum -c -
          unzip -q sdk.zip -d sdk
          python3 - <<'PY'
          import pathlib,struct,hashlib
          b=next(pathlib.Path('sdk').rglob('*.wasm')).read_bytes()
          assert hashlib.sha256(b).hexdigest()=='feb190263b48caed5a81e0009cda35f6d2a23548ccf61d785f019420b857222d'
          magic=b'RSNNPKG'+bytes([0])
          matches=[]
          i=b.find(magic)
          while i>=0:
              if i+28<=len(b):
                  ver,flags,m,p=struct.unpack_from('<HHQQ',b,i+8)
                  if ver==1 and flags==0 and i+28+m+p<=len(b):
                      candidate=b[i:i+28+m+p]
                      if hashlib.sha256(candidate).hexdigest()=='787739972eabb5a1c42c471d178ac0c97b688dce35c72b4291e7e1eeefa9786f':
                          matches.append(candidate)
              i=b.find(magic,i+1)
          assert len(matches)==1, 'Exact model not found; do not substitute weights'
          pathlib.Path('model.rsnn').write_bytes(matches[0])
          print('EXACT MODEL PASS',len(matches[0]))
          PY
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cd engine
          printf '\n[patch.crates-io]\nrsshogi = { path = "../rules/crates/rsshogi" }\n' >> Cargo.toml
          cargo +1.95.0 update -p rsshogi --precise 1.7.2
          export RSSHOGI_EMBEDDED_RSNN_PATH="$PWD/../model.rsnn"
          export RSSHOGI_EMBEDDED_RSNN_SHA256=787739972eabb5a1c42c471d178ac0c97b688dce35c72b4291e7e1eeefa9786f
          cargo +1.95.0 test --lib --locked --features embedded-rsnn
          cargo +1.95.0 rustc --lib --release --locked --crate-type cdylib --target wasm32-unknown-unknown --features c-api,embedded-rsnn
          test -s target/wasm32-unknown-unknown/release/rsshogi_nnue_mini.wasm
          echo EMBEDDED_REBUILD_PASS
