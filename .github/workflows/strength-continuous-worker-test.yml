name: Isolated continuous Worker protocol checks
on:
  push:
    branches: [chatgpt/strength-ci]
    paths:
      - '.github/workflows/strength-continuous-worker-test.yml'
      - 'benchmarks/strength/experiments/continuous-obstacle/worker.js'
      - 'benchmarks/strength/experiments/continuous-obstacle/worker.test.mjs'
      - 'benchmarks/strength/experiments/continuous-obstacle/build-sdk.mjs'
      - 'benchmarks/strength/experiments/continuous-obstacle/report.mjs'
      - 'benchmarks/strength/experiments/continuous-obstacle/report.test.mjs'
      - 'benchmarks/strength/experiments/continuous-obstacle/continuous-controller.mjs'
      - 'benchmarks/strength/experiments/continuous-obstacle/continuous-controller.test.mjs'
permissions:
  contents: read
jobs:
  verify-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked native-continuous Worker protocol tests
        run: |
          set -euo pipefail
          node --check benchmarks/strength/experiments/continuous-obstacle/worker.js
          node --check benchmarks/strength/experiments/continuous-obstacle/build-sdk.mjs
          node --test benchmarks/strength/experiments/continuous-obstacle/worker.test.mjs
          node --check benchmarks/strength/experiments/continuous-obstacle/report.mjs
          node --test benchmarks/strength/experiments/continuous-obstacle/report.test.mjs
          node --check benchmarks/strength/experiments/continuous-obstacle/continuous-controller.mjs
          node --test benchmarks/strength/experiments/continuous-obstacle/continuous-controller.test.mjs
