name: Check rsshogi official WASM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-rsshogi.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned official SDK
        run: |
          curl -fL --retry 3 https://github.com/nyoki-mtl/rsshogi-nnue-mini/releases/download/v0.4.0/rsshogi-nnue-mini-v0.4.0-wasm-sdk.zip -o sdk.zip
          echo '3d05b85949f5ae3bce3cef1f0678a3aeb31d9e8f935565bcc09da63bb19dd1d1  sdk.zip' | sha256sum -c -
          unzip -q sdk.zip -d sdk
          find sdk -type f
          find sdk -type f \( -iname '*license*' -o -iname '*notice*' -o -iname '*readme*' \) -print -exec cat {} \;
      - name: Fetch exact upstream source
        run: git clone --depth 1 --branch v0.4.0 https://github.com/nyoki-mtl/rsshogi-nnue-mini.git upstream
      - name: Smoke test official package without publishing binaries
        run: |
          set -euo pipefail
          wasm="$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)"
          test -s "$wasm"
          dir="$(dirname "$wasm")"
          test -f "$dir/mini.js"
          test -f "$dir/worker.js"
          cp upstream/bindings/wasm/check.mjs "$dir/check.mjs"
          printf '{"type":"module"}\n' > "$dir/package.json"
          node "$dir/check.mjs" "$wasm" | tee smoke.log
          grep -F 'Wasm smoke passed: real model' smoke.log
      - name: Inspect dependency license declarations
        run: |
          cd upstream
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 -c 'import json; p=json.load(open("/tmp/metadata.json")); print("\n".join(x["name"]+" "+x["version"]+" "+str(x["license"]) for x in p["packages"]))'
      - name: Benchmark official WASM
        run: |
          set -euo pipefail
          dir="$(dirname "$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)")"
          cat "$dir/manifest.json"
          cat > "$dir/bench.mjs" <<'EOF'
          import { MiniEngine } from './mini.js';
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const engine = await MiniEngine.create(await readFile(new URL('./rsshogi_nnue_mini.wasm',import.meta.url)));
          const ok = x => {assert.equal(x.ok,true,JSON.stringify(x));return x};
          try {
            ok(engine.request({command:'load_embedded'}));
            ok(engine.request({command:'configure',hash_mb:16,threads:1}));
            for(const moves of [[],['7g7f'],['7g7f','3c3d'],['2g2f','8c8d','2f2e']]){
              for(const ms of [100,500,1500]){
                ok(engine.request({command:'new_game'}));
                ok(engine.request({command:'set_position',sfen:'startpos',moves}));
                const t=performance.now();
                const result=ok(engine.request({command:'search',depth:64,movetime_ms:ms})).result;
                const wall=Math.round(performance.now()-t);
                assert.match(result.bestmove,/^(?:[1-9][a-i][1-9][a-i]\+?|[PLNSGBR]\*[1-9][a-i])$/);
                ok(engine.request({command:'set_position',sfen:'startpos',moves:[...moves,result.bestmove]}));
                console.log(JSON.stringify({moves,ms,wall,...result}));
                assert(wall<ms+2000);
              }
            }
          } finally {engine.dispose()}
          EOF
          node "$dir/bench.mjs"
      - name: Check game position adapter
        run: |
          set -euo pipefail
          dir="$(dirname "$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)")"
          curl -fL https://raw.githubusercontent.com/amatouazuwo/shogi-is-luck-engine/f96f70f0ba955c84e8bdd730c42a533301b7c2b2/scripts/rsshogi-position.mjs -o "$dir/position.mjs"
          cat > "$dir/position-test.mjs" <<'EOF'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {MiniEngine} from './mini.js';
          import {toSfen,toUsi,matchLegal,immediateKingCapture} from './position.mjs';
          const e=await MiniEngine.create(await readFile(new URL('./rsshogi_nnue_mini.wasm',import.meta.url)));
          const ok=x=>{assert.equal(x.ok,true,JSON.stringify(x));return x};
          const board=Array(81).fill(null);
          const put=(i,type,side,pr=false)=>board[i]={type,side,pr};
          for(let c=0;c<9;c++){put(c,'LNSGKGSNL'[c],1);put(72+c,'LNSGKGSNL'[c],0);put(18+c,'P',1);put(54+c,'P',0)}
          put(10,'R',1);put(16,'B',1);put(64,'B',0);put(70,'R',0);
          const g={board,turn:0,hands:[{},{}],steps:0};
          assert.equal(toSfen(g),'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1');
          assert.equal(toUsi({from:56,to:47}), '7g7f');
          assert.equal(toUsi({drop:'P',to:40}),'P*5e');
          assert.equal(toUsi({from:56,to:47,promote:true}),'7g7f+');
          assert.equal(matchLegal('7g7f',[{from:56,to:47}]).to,47);
          assert.equal(matchLegal('resign',[]),null);
          for(const extra of [{holes:[40]},{effect:'dragon'},{effect:'doubleSecond'},{teleportActive:0},{seatShuffleClaim:{}}])assert.equal(toSfen({...g,...extra}),null);
          ok(e.request({command:'load_embedded'}));
          let seed=12345;
          const rand=n=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed%n};
          for(let i=0;i<40;i++){
            const b=board.map(p=>p&&{...p});
            for(const start of [0,72])for(let j=0;j<12;j++){const a=start+rand(9),c=start+rand(9);[b[a],b[c]]=[b[c],b[a]]}
            const sfen=toSfen({...g,board:b,turn:i%2});
            ok(e.request({command:'set_position',sfen,moves:[]}));
            const result=ok(e.request({command:'search',movetime_ms:100})).result;
            ok(e.request({command:'set_position',sfen,moves:[result.bestmove]}));
            console.log(JSON.stringify({i,sfen,bestmove:result.bestmove,depth:result.depth}));
          }
          for(const turn of [0,1]){
            const board=Array(81).fill(null);
            board[40]={type:'K',side:1-turn};
            board[41]={type:'K',side:turn};
            const win={from:39,to:40,dragon:true}, own={from:39,to:41}, quiet={from:39,to:38};
            for(const effect of ['doubleSecond','dragon',null]){
              assert.equal(immediateKingCapture({board,turn,effect},[quiet,win]),win);
              assert.equal(immediateKingCapture({board,turn,effect},[quiet,own]),null);
              assert.equal(immediateKingCapture({board,turn,effect},[]),null);
            }
          }
          e.dispose();
          console.log('KING CAPTURE PRIORITY PASSED');
          console.log('POSITION TEST PASSED: 40 formations');
          EOF
          node "$dir/position-test.mjs"
      - name: Browser client protocol test
        run: |
          set -euo pipefail
          dir="$(dirname "$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)")"
          curl -fL https://raw.githubusercontent.com/amatouazuwo/shogi-is-luck-engine/08ebe90c7dba62c890f5e87b6dcbb768c946183c/scripts/rsshogi-client.mjs -o "$dir/rsshogi-client.mjs"
          cp "$dir/position.mjs" "$dir/rsshogi-position.mjs"
          cat > "$dir/client-test.mjs" <<'EOF'
          import assert from 'node:assert/strict';
          import {BrowserEngine} from './rsshogi-client.mjs';
          import {toUsi} from './rsshogi-position.mjs';
          // Deterministic protocol double: exercises request IDs, stale responses, errors, legal filtering.
          let last, chosen='7g7f';
          class MockWorker {
            postMessage(m){queueMicrotask(()=>{
              if(this.dead)return;
              if(m.command==='go'){
                this.onmessage({data:{id:m.id,ok:true,event:'info',result:{bestmove:'1a1b'}}});
                this.onmessage({data:{id:m.id,ok:true,event:'bestmove',result:{bestmove:chosen}}});
              }else this.onmessage({data:{id:m.id,ok:true,event:m.command}});
            });}
            terminate(){this.dead=true;}
          }
          const e=new BrowserEngine('worker.js','engine.wasm',{workerFactory:()=>last=new MockWorker(),timeout:1000});
          const board=Array(81).fill(null);
          board[4]={type:'K',side:1};board[76]={type:'K',side:0};board[56]={type:'P',side:0};
          const g={board,turn:0,hands:[{},{}]};
          const legal=[{from:56,to:47}];
          assert.equal(toUsi(await e.choose(g,legal)), '7g7f');
          chosen='1a1b';assert.equal(await e.choose(g,legal),null);
          assert.equal(await e.choose({...g,holes:[40]},legal),null);
          const win={from:56,to:4};assert.equal(await e.choose(g,[win]),win);
          chosen='7g7f';const pending=e.choose(g,legal);e.reset();assert.equal(await pending,null);
          e.reset();console.log('CLIENT PROTOCOL TEST PASSED');
          EOF
          node "$dir/client-test.mjs"
