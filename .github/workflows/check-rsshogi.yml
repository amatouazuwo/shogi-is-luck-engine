name: Check rsshogi official WASM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-rsshogi.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned official SDK
        run: |
          curl -fL --retry 3 https://github.com/nyoki-mtl/rsshogi-nnue-mini/releases/download/v0.4.0/rsshogi-nnue-mini-v0.4.0-wasm-sdk.zip -o sdk.zip
          echo '3d05b85949f5ae3bce3cef1f0678a3aeb31d9e8f935565bcc09da63bb19dd1d1  sdk.zip' | sha256sum -c -
          unzip -q sdk.zip -d sdk
          find sdk -type f
          find sdk -type f \( -iname '*license*' -o -iname '*notice*' -o -iname '*readme*' \) -print -exec cat {} \;
      - name: Fetch exact upstream source
        run: git clone --depth 1 --branch v0.4.0 https://github.com/nyoki-mtl/rsshogi-nnue-mini.git upstream
      - name: Smoke test official package without publishing binaries
        run: |
          set -euo pipefail
          wasm="$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)"
          test -s "$wasm"
          dir="$(dirname "$wasm")"
          test -f "$dir/mini.js"
          test -f "$dir/worker.js"
          cp upstream/bindings/wasm/check.mjs "$dir/check.mjs"
          printf '{"type":"module"}\n' > "$dir/package.json"
          node "$dir/check.mjs" "$wasm" | tee smoke.log
          grep -F 'Wasm smoke passed: real model' smoke.log
      - name: Inspect dependency license declarations
        run: |
          cd upstream
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 -c 'import json; p=json.load(open("/tmp/metadata.json")); print("\n".join(x["name"]+" "+x["version"]+" "+str(x["license"]) for x in p["packages"]))'
      - name: Benchmark official WASM
        run: |
          set -euo pipefail
          dir="$(dirname "$(find sdk -name rsshogi_nnue_mini.wasm -print -quit)")"
          cat "$dir/manifest.json"
          cat > "$dir/bench.mjs" <<'EOF'
          import { MiniEngine } from './mini.js';
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const engine = await MiniEngine.create(await readFile(new URL('./rsshogi_nnue_mini.wasm',import.meta.url)));
          const ok = x => {assert.equal(x.ok,true,JSON.stringify(x));return x};
          try {
            ok(engine.request({command:'load_embedded'}));
            ok(engine.request({command:'configure',hash_mb:16,threads:1}));
            for(const moves of [[],['7g7f'],['7g7f','3c3d'],['2g2f','8c8d','2f2e']]){
              for(const ms of [100,500,1500]){
                ok(engine.request({command:'new_game'}));
                ok(engine.request({command:'set_position',sfen:'startpos',moves}));
                const t=performance.now();
                const result=ok(engine.request({command:'search',depth:64,movetime_ms:ms})).result;
                const wall=Math.round(performance.now()-t);
                assert.match(result.bestmove,/^(?:[1-9][a-i][1-9][a-i]\+?|[PLNSGBR]\*[1-9][a-i])$/);
                ok(engine.request({command:'set_position',sfen:'startpos',moves:[...moves,result.bestmove]}));
                console.log(JSON.stringify({moves,ms,wall,...result}));
                assert(wall<ms+2000);
              }
            }
          } finally {engine.dispose()}
          EOF
          node "$dir/bench.mjs"
